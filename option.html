<html>
<html>
	<head>
		<title>Option</title>
		<link type="text/css" href="assets/css/option.css" rel="stylesheet" />
		<script type="text/javascript" src="assets/js/jquery-3.7.1.min.js"></script>
		<script type="text/javascript" src="option.js"></script>
		<script type="text/javascript" src="assets/js/preference.js"></script>
	</head>
	<body>
		<preferences>
			<preference name="initialsearch"></preference>
			<preference name="opento" defval="current" ></preference>
		</preferences>

		<div class="content"><form>
			<div>
				<strong id="label-opento">Default Open to</strong>
			</div>
			<div id="group-opento">
				<select id="opento" preference="opento" name="opento">
					<option id="label-current" value="current"></option>
					<option id="label-tab" value="tab"></option>
					<option id="label-selected" value="selected"></option>
					<option id="label-window" value="window"></option>
					<option id="label-flash" value="flash"></option>
				</select>
			</div>
		</form></div>

	</body>
</html>

name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CHROME_EXTENSIONS_ZIP: https://github.com/Julusian/chrome-extensions-zip/releases/download/v1.0.0/chrome-extensions-zip-v1.0.0-amd64

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(grep '"version"' manifest.json | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"
          
      - name: Download chrome-extensions-zip tool
        run: |
          wget -O chrome-extensions-zip ${{ env.CHROME_EXTENSIONS_ZIP }}
          chmod +x chrome-extensions-zip
          
      - name: Generate self-signed certificate
        run: |
          openssl genrsa -out bookmarks-search.pem 2048
          
      - name: Create release package
        run: |
          mkdir -p release
          # 复制所有必需的文件到release目录
          cp -r _locales assets *.html *.js manifest.json release/
          
      - name: Create ZIP package
        run: |
          cd release
          zip -r ../bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip *
          cd ..
          
      - name: Create CRX package
        run: |
          # 使用chrome-extensions-zip工具打包为crx
          ./chrome-extensions-zip pack \
            --key bookmarks-search.pem \
            --output bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx \
            release
          
      - name: Calculate CRX file hash
        id: crx_hash
        run: |
          HASH=$(openssl sha1 -binary bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx | xxd -p -u -c 20)
          echo "HASH=$HASH" >> $GITHUB_OUTPUT
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🚀 Release Notes
            
            Bookmarks Search Extension v${{ steps.get_version.outputs.VERSION }}
            
            ## 📦 Installation
            
            ### ZIP Package (Recommended for Development)
            1. Download `bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip`
            2. Extract to any folder
            3. Open `chrome://extensions/` in Chrome browser
            4. Enable "Developer mode" (top right)
            5. Click "Load unpacked"
            6. Select the extracted folder
            
            ### CRX Package
            1. Download `bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx`
            2. Drag and drop to `chrome://extensions/` page
            3. Confirm installation when prompted
            
            ### Using Certificate
            CRX App ID: ${{ steps.crx_hash.outputs.HASH }}
            
            ## 📝 Changelog
            See project homepage for full changelog
          draft: false
          prerelease: false
          
      - name: Upload ZIP Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip
          
      - name: Upload CRX Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx
          asset_name: bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx
          asset_content_type: application/x-chrome-extension
          
      - name: Upload Certificate (Secret)
        uses: actions/upload-artifact@v4
        with:
          name: extension-certificate
          path: bookmarks-search.pem
          retention-days: 90
          
      - name: Generate build info
        run: |
          cat > build-info.txt << EOF
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Version: ${{ steps.get_version.outputs.VERSION }}
          Commit: ${{ github.sha }}
          Tag: ${{ github.ref_name }}
          CRX App ID: ${{ steps.crx_hash.outputs.HASH }}
          EOF
          
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt

name: Build Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CRX_PRIVATE_KEY_PATH: ./extension-key.pem
  RELEASE_DIR: ./release
  EXT_NAME: bookmarks-search

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Get version from tag/manifest (修复版本号拼接)
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(grep -E '"version"\s*:\s*"[^"]+"' manifest.json | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/')
          fi
          # 统一版本号格式，避免v前缀重复
          CLEAN_VERSION=${VERSION#v}
          echo "VERSION=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Extension version: $CLEAN_VERSION (tag: $VERSION)"
          
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium-browser zip unzip openssl xxd
          chromium-browser --version
        
      - name: Prepare fixed private key
        run: |
          echo "${{ secrets.CRX_PRIVATE_KEY }}" > ${{ env.CRX_PRIVATE_KEY_PATH }}
          openssl rsa -in ${{ env.CRX_PRIVATE_KEY_PATH }} -check
          echo "✅ Private key loaded"
          
      - name: Create release source package
        run: |
          mkdir -p ${{ env.RELEASE_DIR }}
          cp -r _locales assets *.html *.js manifest.json ${{ env.RELEASE_DIR }}/ 2>/dev/null
          echo "✅ Source files copied"
          
      - name: Create ZIP package
        run: |
          cd ${{ env.RELEASE_DIR }}
          zip -r ../${{ env.EXT_NAME }}-${{ steps.get_version.outputs.VERSION }}.zip *
          cd ..
          ls -lh ${{ env.EXT_NAME }}-${{ steps.get_version.outputs.VERSION }}.zip
          echo "✅ ZIP package built"
          
      - name: Build CRX package (Chrome官方命令)
        run: |
          chromium-browser \
            --pack-extension=${{ env.RELEASE_DIR }} \
            --pack-extension-key=${{ env.CRX_PRIVATE_KEY_PATH }}
          mv ${{ env.RELEASE_DIR }}.crx ${{ env.EXT_NAME }}-${{ steps.get_version.outputs.VERSION }}.crx
          ls -lh ${{ env.EXT_NAME }}-${{ steps.get_version.outputs.VERSION }}.crx
          echo "✅ CRX package built"
          
      - name: Calculate CRX App ID
        id: crx_hash
        run: |
          PUB_KEY=$(openssl rsa -in ${{ env.CRX_PRIVATE_KEY_PATH }} -pubout -outform DER | base64)
          APP_ID=$(echo -n "$PUB_KEY" | openssl sha256 -binary | xxd -p -u -c32 | head -c32)
          echo "HASH=$APP_ID" >> $GITHUB_OUTPUT
          echo "✅ CRX App ID: $APP_ID"
          
      - name: Create GitHub Release (核心修复：新版动作)
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🚀 Bookmarks Search v${{ steps.get_version.outputs.VERSION }}
            ## 📦 Installation
            ### ZIP Package (Recommended)
            1. Download `${{ env.EXT_NAME }}-${{ steps.get_version.outputs.VERSION }}.zip`
            2. Chrome → `chrome://extensions/` → 开启开发者模式 → 加载已解压的扩展程序
            ### CRX Package
            1. Download `${{ env.EXT_NAME }}-${{ steps.get_version.outputs.VERSION }}.crx`
            2. 拖拽至 `chrome://extensions/` 页面安装
            ## 📌 Info
            - CRX App ID: ${{ steps.crx_hash.outputs.HASH }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          # ✅ 核心：直接在该步骤上传所有资产，废弃旧版upload-release-asset
          files: |
            ./${{ env.EXT_NAME }}-${{ steps.get_version.outputs.VERSION }}.zip
            ./${{ env.EXT_NAME }}-${{ steps.get_version.outputs.VERSION }}.crx
          
      - name: Upload build info & key
        uses: actions/upload-artifact@v4
        with:
          name: build-info-and-key
          path: |
            build-info.txt
            ${{ env.CRX_PRIVATE_KEY_PATH }}
          retention-days: 90
          
      - name: Generate build info
        run: |
          cat > build-info.txt << EOF
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Version: ${{ steps.get_version.outputs.VERSION }}
          Tag: ${{ steps.get_version.outputs.TAG_VERSION }}
          Commit: ${{ github.sha }}
          CRX App ID: ${{ steps.crx_hash.outputs.HASH }}
          EOF
          echo "✅ Build info generated"
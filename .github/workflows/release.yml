name: Build Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CRX_KEY_PATH: /tmp/bookmarks-search.pem

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(grep '"version"' manifest.json | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"
          
      - name: Install Chromium and utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser zip unzip
        
      - name: Generate self-signed certificate
        run: |
          openssl genrsa -out ${{ env.CRX_KEY_PATH }} 2048
          echo "Private key generated successfully"
          
      - name: Create release package
        run: |
          mkdir -p release
          # 复制所有必需的文件到release目录
          cp -r _locales assets *.html *.js manifest.json release/
          
      - name: Create ZIP package
        run: |
          cd release
          zip -r ../bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip *
          cd ..
          
      - name: Create CRX package using Chromium
        run: |
          # 使用Chromium的打包脚本
          cat > pack-crx.sh << 'EOF'
          #!/bin/bash
          KEY="$1"
          EXT_DIR="$2"
          OUTPUT="$3"
          
          VERSION=$(grep '"version"' "$EXT_DIR/manifest.json" | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          
          # 计算公钥
          PUB_KEY=$(openssl rsa -in "$KEY" -pubout -outform DER | base64 | tr -d '=+/\\' | tr '\n' '_')
          
          # 创建ZIP
          cd "$EXT_DIR"
          zip -qr ../tmp-extension.zip .
          cd ..
          
          # 计算签名
          SIGNATURE=$(openssl sha1 -sha256 -binary -sign "$KEY" tmp-extension.zip | base64 | tr -d '=+/\\' | tr '\n' '_')
          
          # CRX文件头
          echo -n "Cr24" > "$OUTPUT"
          echo -en "\x03\x00\x00\x00" >> "$OUTPUT"
          
          # 公钥长度（小端）
          KEY_LEN=${#PUB_KEY}
          KEY_LEN_HEX=$(printf "%08x" $KEY_LEN)
          echo -ne "\\x${KEY_LEN_HEX:6:2}\\x${KEY_LEN_HEX:4:2}\\x${KEY_LEN_HEX:2:2}\\x${KEY_LEN_HEX:0:2}" >> "$OUTPUT"
          
          # 签名长度（小端）
          SIG_LEN=${#SIGNATURE}
          SIG_LEN_HEX=$(printf "%08x" $SIG_LEN)
          echo -ne "\\x${SIG_LEN_HEX:6:2}\\x${SIG_LEN_HEX:4:2}\\x${SIG_LEN_HEX:2:2}\\x${SIG_LEN_HEX:0:2}" >> "$OUTPUT"
          
          # 公钥（base64编码）
          echo -n "$PUB_KEY" | base64 -d >> "$OUTPUT"
          
          # 签名（base64编码）
          echo -n "$SIGNATURE" | base64 -d >> "$OUTPUT"
          
          # ZIP内容
          cat tmp-extension.zip >> "$OUTPUT"
          
          rm tmp-extension.zip
          echo "CRX package created: $OUTPUT"
          EOF
          
          chmod +x pack-crx.sh
          ./pack-crx.sh ${{ env.CRX_KEY_PATH }} release bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx
          
      - name: Calculate CRX App ID
        id: crx_hash
        run: |
          # 从CRX文件提取公钥并计算App ID
          PUB_KEY=$(openssl rsa -in ${{ env.CRX_KEY_PATH }} -pubout -outform DER | base64)
          APP_ID=$(echo -n "$PUB_KEY" | openssl sha256 -binary | xxd -p -u -c 32 | tr '[:lower:]' '[:upper:]' | head -c 32)
          echo "HASH=$APP_ID" >> $GITHUB_OUTPUT
          echo "CRX App ID: $APP_ID"
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🚀 Release Notes
            
            Bookmarks Search Extension v${{ steps.get_version.outputs.VERSION }}
            
            ## 📦 Installation
            
            ### ZIP Package (Recommended for Development)
            1. Download `bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip`
            2. Extract to any folder
            3. Open `chrome://extensions/` in Chrome browser
            4. Enable "Developer mode" (top right)
            5. Click "Load unpacked"
            6. Select the extracted folder
            
            ### CRX Package
            1. Download `bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx`
            2. Drag and drop to `chrome://extensions/` page
            3. Confirm installation when prompted
            
            ### Using Certificate
            CRX App ID: ${{ steps.crx_hash.outputs.HASH }}
            
            ## 📝 Changelog
            See project homepage for full changelog
          draft: false
          prerelease: false
          
      - name: Upload ZIP Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip
          
      - name: Upload CRX Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx
          asset_name: bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx
          asset_content_type: application/x-chrome-extension
          
      - name: Upload Certificate (Secret)
        uses: actions/upload-artifact@v4
        with:
          name: extension-certificate
          path: ${{ env.CRX_KEY_PATH }}
          retention-days: 90
          
      - name: Generate build info
        run: |
          cat > build-info.txt << EOF
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Version: ${{ steps.get_version.outputs.VERSION }}
          Commit: ${{ github.sha }}
          Tag: ${{ github.ref_name }}
          CRX App ID: ${{ steps.crx_hash.outputs.HASH }}
          EOF
          
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt

name: Build Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CRX_KEY_PATH: /tmp/bookmarks-search.pem

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(grep '"version"' manifest.json | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"
          
      - name: Install Chromium and utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser zip unzip
        
      - name: Generate self-signed certificate
        run: |
          openssl genrsa -out ${{ env.CRX_KEY_PATH }} 2048
          echo "Private key generated successfully"
          
      - name: Create release package
        run: |
          mkdir -p release
          # 复制所有必需的文件到release目录
          cp -r _locales assets *.html *.js manifest.json release/
          
      - name: Create ZIP package
        run: |
          cd release
          zip -r ../bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip *
          cd ..
          
      - name: Create CRX package using Python
        run: |
          # 使用Python创建CRX v3文件（更可靠）
          cat > pack_crx.py << 'PYEOF'
          #!/usr/bin/env python3
          import struct
          import subprocess
          import zipfile
          import sys
          import os

          def create_crx(key_path, ext_dir, output_path):
              # 1. 创建扩展ZIP
              print("Creating extension ZIP...")
              with zipfile.ZipFile('extension.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
                  for root, dirs, files in os.walk(ext_dir):
                      for file in files:
                          file_path = os.path.join(root, file)
                          arcname = os.path.relpath(file_path, ext_dir)
                          zf.write(file_path, arcname)

              # 2. 提取公钥
              print("Extracting public key...")
              result = subprocess.run(
                  ['openssl', 'rsa', '-in', key_path, '-pubout', '-outform', 'DER'],
                  capture_output=True
              )
              public_key = result.stdout
              public_key_len = len(public_key)

              # 3. 计算签名
              print("Computing signature...")
              with open('extension.zip', 'rb') as f:
                  zip_data = f.read()

              result = subprocess.run(
                  ['openssl', 'dgst', '-sha256', '-binary', '-sign', key_path],
                  input=zip_data,
                  capture_output=True
              )
              signature = result.stdout
              signature_len = len(signature)

              # 4. 构建CRX文件头 (CRX3格式)
              print("Building CRX header...")
              header = b'Cr24'  # 魔数
              header += struct.pack('<I', 3)  # 版本号
              header += struct.pack('<I', public_key_len)  # 公钥长度
              header += struct.pack('<I', signature_len)  # 签名长度

              # 5. 写入CRX文件
              print(f"Writing CRX file to {output_path}...")
              with open(output_path, 'wb') as f:
                  f.write(header)
                  f.write(public_key)
                  f.write(signature)
                  f.write(zip_data)

              # 6. 清理
              os.remove('extension.zip')

              print(f"CRX package created successfully!")
              print(f"Public key length: {public_key_len}")
              print(f"Signature length: {signature_len}")
              print(f"ZIP length: {len(zip_data)}")

          if __name__ == '__main__':
              key_path, ext_dir, output_path = sys.argv[1], sys.argv[2], sys.argv[3]
              create_crx(key_path, ext_dir, output_path)
          PYEOF

          chmod +x pack_crx.py
          python3 pack_crx.py ${{ env.CRX_KEY_PATH }} release bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx
          
      - name: Calculate CRX App ID
        id: crx_hash
        run: |
          # 从CRX文件提取公钥并计算App ID
          PUB_KEY=$(openssl rsa -in ${{ env.CRX_KEY_PATH }} -pubout -outform DER | base64)
          APP_ID=$(echo -n "$PUB_KEY" | openssl sha256 -binary | xxd -p -u -c 32 | tr '[:lower:]' '[:upper:]' | head -c 32)
          echo "HASH=$APP_ID" >> $GITHUB_OUTPUT
          echo "CRX App ID: $APP_ID"
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🚀 Release Notes

            Bookmarks Search Extension v${{ steps.get_version.outputs.VERSION }}

            ## 📦 Installation

            ### ZIP Package (Recommended for Development)
            1. Download `bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip`
            2. Extract to any folder
            3. Open `chrome://extensions/` in Chrome browser
            4. Enable "Developer mode" (top right)
            5. Click "Load unpacked"
            6. Select the extracted folder

            ### CRX Package
            1. Download `bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx`
            2. Drag and drop to `chrome://extensions/` page
            3. Confirm installation when prompted

            ### Using Certificate
            CRX App ID: ${{ steps.crx_hash.outputs.HASH }}

            ## 📝 Changelog
            See project homepage for full changelog
          draft: false
          prerelease: false
          
      - name: Upload ZIP Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: bookmarks-search-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip
          
      - name: Upload CRX Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx
          asset_name: bookmarks-search-${{ steps.get_version.outputs.VERSION }}.crx
          asset_content_type: application/x-chrome-extension
          
      - name: Upload Certificate (Secret)
        uses: actions/upload-artifact@v4
        with:
          name: extension-certificate
          path: ${{ env.CRX_KEY_PATH }}
          retention-days: 90
          
      - name: Generate build info
        run: |
          cat > build-info.txt << 'BUILDEOF'
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Version: ${{ steps.get_version.outputs.VERSION }}
          Commit: ${{ github.sha }}
          Tag: ${{ github.ref_name }}
          CRX App ID: ${{ steps.crx_hash.outputs.HASH }}
          BUILDEOF
          
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt
